<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'">
  <title>Kerdiis</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="period">
      <button class="icon" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
      <button class="icon" id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
      <button class="text" id="today">Сегодня</button>
      <h1 id="title"></h1>
    </div>
    <div class="tools">
      <div class="views" role="group" aria-label="Вид календаря">
        <button data-view="day">День</button>
        <button data-view="week">Неделя</button>
        <button data-view="month">Месяц</button>
      </div>
      <button class="text" id="open-deadlines">Сроки <span id="deadline-count" class="deadlinecount" hidden></span></button>
      <button class="text" id="open-signals" hidden>Сигналы <span id="signal-count" class="deadlinecount late" hidden></span></button>
      <button class="text menubutton" id="open-sections" popovertarget="sections" aria-haspopup="menu">Разделы <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div id="sections" class="sectionmenu" popover role="menu" aria-label="Разделы">
        <button role="menuitem" id="open-reports">Отчёты</button>
        <button role="menuitem" id="open-catalog">Справочники</button>
        <button role="menuitem" id="open-journal">Журнал изменений</button>
        <button role="menuitem" id="open-gear">Техника</button>
        <button role="menuitem" id="open-portal" hidden>Студентам</button>
      </div>
      <button class="primary" id="add">Добавить</button>
      <time id="clock"></time>
      <button class="icon" id="theme" aria-label="Сменить тему"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" class="filled"/></svg></button>
      <button class="icon" id="settings" aria-label="Настройки"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
      <button class="icon" id="minimize" aria-label="Свернуть программу"><svg viewBox="0 0 24 24"><path d="M5 19h14"/></svg></button>
      <button class="icon" id="quit" aria-label="Закрыть программу"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>
  <div id="banner" class="banner" role="alert" hidden></div>
  <main id="board"></main>
  <footer class="legend" aria-label="Обозначения">
    <span class="t-lesson">Занятие</span>
    <span class="t-practice">Практика</span>
    <span class="t-task">Задание</span>
    <span class="t-event">Мероприятие</span>
    <div id="ticker" class="ticker" aria-label="Напоминания" hidden><div class="tickertrack"></div></div>
    <button id="notices-open" class="noticesbutton" hidden>Напоминания</button>
    <button id="pet-open" class="petbutton" hidden></button>
  </footer>
  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="details" class="sheet"></dialog>
  <dialog id="form" class="sheet wide"></dialog>
  <dialog id="preferences" class="sheet"></dialog>
  <dialog id="catalog" class="sheet wide"></dialog>
  <dialog id="picker" class="sheet"></dialog>
  <dialog id="roll" class="sheet wide"></dialog>
  <dialog id="reports" class="sheet full"></dialog>
  <dialog id="paper" class="sheet wide"></dialog>
  <dialog id="pet" class="sheet"></dialog>
  <dialog id="quitask" class="sheet small"></dialog>
  <dialog id="gear" class="sheet full"></dialog>
  <dialog id="deadlines" class="sheet full"></dialog>
  <dialog id="journal" class="sheet full"></dialog>
  <dialog id="portal" class="sheet"></dialog>
  <dialog id="donate" class="sheet"></dialog>
  <dialog id="signals" class="sheet"></dialog>
  <dialog id="portfolio" class="sheet full"></dialog>
  <dialog id="notices" class="sheet"></dialog>
  <dialog id="memo" class="sheet small"></dialog>
  <dialog id="welcome" class="sheet small"></dialog>
  <div id="printarea"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
