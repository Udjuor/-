name: Сборка установщика

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm install

      - name: Модульные тесты
        run: npm test

      - name: Взять версию из метки релиза
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          npm version $version --no-git-tag-version --allow-same-version

      - name: Собрать установщик
        run: npm run dist

      - name: Поставить прошлую версию
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Новая версия ставится поверх настоящего релиза, как при обновлении панелей.
          New-Item -ItemType Directory -Force previous | Out-Null
          gh release download v1.10.0 --pattern '*.exe' --dir previous
          $old = (Get-ChildItem previous/*.exe).FullName
          $p = Start-Process $old -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Код выхода установщика прошлой версии: $($p.ExitCode)" }
          Get-ChildItem "$env:PUBLIC\Desktop" | Format-Table Name | Out-String | Write-Host
          # Запись из прошлой версии должна пережить обновление.
          $events = "$env:ProgramData\StudentCalendar\data\events"
          New-Item -ItemType Directory -Force $events | Out-Null
          '{"id":"11111111-1111-4111-8111-111111111111","title":"Старая запись","date":"2026-01-10","start":"09:00","end":"10:00","updatedAt":"2026-01-01T00:00:00.000Z"}' | Set-Content "$events\11111111-1111-4111-8111-111111111111.json"

      - name: Обновить прошлую версию её же задачей
        shell: pwsh
        run: |
          # Настоящий путь панелей: старая задача скачивает установщик с новым именем.
          $setup = (Get-ChildItem dist/Kerdiis-Setup-*.exe).FullName
          New-Item -ItemType Directory -Force oldfeed/v99.0.0, oldfeed/latest/download | Out-Null
          Copy-Item $setup oldfeed/v99.0.0/
          $yml = (Get-Content dist/latest.yml -Raw) -replace '(?m)^version:.*', 'version: 99.0.0'
          [IO.File]::WriteAllText("$PWD/oldfeed/latest/download/latest.yml", $yml)
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8124', '--bind', '127.0.0.1', '--directory', 'oldfeed' -PassThru
          Start-Sleep -Seconds 3
          $oldRoot = Join-Path $env:ProgramFiles 'StudentCalendarUpdate'
          $script = Join-Path $oldRoot 'update.ps1'
          $text = (Get-Content $script -Raw) -replace 'https://github.com/Udjuor/-/releases/latest/download/latest.yml', 'http://127.0.0.1:8124/latest/download/latest.yml' -replace 'https://github.com/Udjuor/-/releases/download', 'http://127.0.0.1:8124'
          Set-Content $script $text -Encoding ascii
          Start-ScheduledTask -TaskName StudentCalendarUpdate
          $result = $null
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 5
            if (Test-Path "$oldRoot\status.json") {
              $result = (Get-Content "$oldRoot\status.json" -Raw | ConvertFrom-Json).result
              if ($result) { break }
            }
          }
          Write-Host "Результат старой задачи: $result"
          Stop-Process -Id $server.Id -Force
          if ($result -ne 'installed') { throw "Старая задача не обновила программу: $result" }
          $run = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run').Kerdiis
          if (-not $run) { throw 'Нет новой записи автозапуска' }
          $launch = (Get-ScheduledTask -TaskName StudentCalendarLaunch).Actions[0].Execute
          if ($launch -ne $run.Trim('"')) { throw "Старая задача запуска указывает на $launch" }
          Get-ScheduledTask -TaskName KerdiisUpdate | Out-Null
          Get-Content (Join-Path $env:ProgramFiles 'KerdiisUpdate\register.log') | Write-Host

      - name: Установить без вопросов, как на панелях
        shell: pwsh
        run: |
          # Обе версии собраны из одной программы, разница задаётся именем установщика.
          $setup = (Get-ChildItem dist/Kerdiis-Setup-*.exe).FullName
          if ((Get-Content (Join-Path (Split-Path (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run').Kerdiis.Trim('"')) 'edition.txt') -Raw).Trim() -ne 'client') { throw 'Панель из прошлой версии не стала клиентом' }
          $admin = $setup -replace 'Kerdiis-Setup', 'Kerdiis-Admin-Setup'
          Copy-Item $setup $admin
          $p = Start-Process $admin -ArgumentList '/S', '/SYNCKEY=CI000-CI000-CI000-CI000', '/PEERS=10.0.2.15,10.0.3.7' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Код выхода установщика: $($p.ExitCode)" }

      - name: Проверить автозапуск, настройки и права
        shell: pwsh
        run: |
          $run = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run').Kerdiis
          if (-not $run) { throw 'Нет записи автозапуска' }
          Write-Host "Автозапуск: $run"
          $exe = $run.Trim('"')
          if (-not (Test-Path -LiteralPath $exe)) { throw "Нет программы: $exe" }
          $desktop = Get-ChildItem "$env:PUBLIC\Desktop" | ForEach-Object Name
          Write-Host ($desktop -join ', ')
          $shortcut = 'Kerdiis.lnk'
          if ($desktop -notcontains $shortcut) { throw 'Нет ярлыка с новым названием' }
          if ($desktop -match 'Календарь|Horatus|Lumo|Paratus|Староста') { throw 'Остался старый ярлык' }
          if ((Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run').StudentCalendar) { throw 'Осталась старая запись автозапуска' }
          if (Test-Path "$env:ProgramData\StudentCalendar") { throw 'Папка данных не переехала' }
          if (-not (Test-Path "$env:ProgramData\Kerdiis\data\events\11111111-1111-4111-8111-111111111111.json")) { throw 'Данные прошлой версии потеряны' }
          foreach ($name in 'StudentCalendarUpdate', 'StudentCalendarLaunch') {
            if (Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue) { throw "Осталась старая задача $name" }
          }
          if (Test-Path (Join-Path $env:ProgramFiles 'StudentCalendarUpdate')) { throw 'Остался старый каталог обновления' }
          $apps = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
          if (-not ($apps | Where-Object { $_.DisplayName -like 'Kerdiis*' })) { throw 'В списке программ нет Kerdiis' }
          if ($apps | Where-Object { $_.DisplayName -match 'Календарь|Horatus|StudentCalendar' }) { throw 'В списке программ старое название' }
          if ($exe -notlike '*\Kerdiis\Kerdiis.exe') { throw "Программа в старой папке: $exe" }
          if (Test-Path (Join-Path $env:ProgramFiles 'StudentCalendar')) { throw 'Осталась старая папка программы' }
          "CAL_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ((Get-Content (Join-Path (Split-Path $exe) 'edition.txt') -Raw).Trim() -ne 'admin') { throw 'Не установилась версия для преподавателей' }
          $ini = Get-Content "$env:ProgramData\Kerdiis\config.ini" -Raw
          Write-Host $ini
          if ($ini -notmatch 'syncKey=CI000-CI000-CI000-CI000') { throw 'Ключ сети не записан' }
          if ($ini -notmatch 'peers=10\.0\.2\.15,10\.0\.3\.7') { throw 'Адреса устройств не записаны' }
          $rule = netsh advfirewall firewall show rule name=Kerdiis verbose | Out-String
          Write-Host $rule
          if ($LASTEXITCODE -ne 0 -or $rule -notmatch 'Kerdiis\.exe') { throw 'Нет правила брандмауэра' }
          $sid = New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-545'
          $group = $sid.Translate([Security.Principal.NTAccount]).Value
          $acl = Get-Acl "$env:ProgramData\Kerdiis"
          if (-not ($acl.Access | Where-Object { $_.IdentityReference -eq $group -and $_.FileSystemRights -match 'Modify' })) {
            throw 'Нет прав на запись у группы «Пользователи»'
          }

      - name: Проверить установленную программу
        shell: pwsh
        env:
          SHOTS: shots
        run: |
          npm install --no-save playwright
          node scripts/e2e.cjs

      - name: Проверить клиент для панелей
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/Kerdiis-Setup-*.exe).FullName
          $p = Start-Process $setup -ArgumentList '/S', '/EDITION=client' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Код выхода установщика: $($p.ExitCode)" }
          if ((Get-Content (Join-Path (Split-Path $env:CAL_EXE) 'edition.txt') -Raw).Trim() -ne 'client') { throw 'Не установился клиент' }
          node scripts/e2e-client.cjs

      - name: Проверить автообновление
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramFiles 'KerdiisUpdate'
          Get-ChildItem $root | Format-Table Name, Length | Out-String | Write-Host
          Get-Content (Join-Path $root 'register.log') | Write-Host
          $task = Get-ScheduledTask -TaskName KerdiisUpdate
          if ($task.Principal.UserId -ne 'SYSTEM') { throw "Задача обновления не от SYSTEM: $($task.Principal.UserId)" }
          Get-ScheduledTask -TaskName KerdiisLaunch | Out-Null
          $service = New-Object -ComObject Schedule.Service
          $service.Connect()
          $sddl = $service.GetFolder('\').GetTask('KerdiisUpdate').GetSecurityDescriptor(0xF)
          Write-Host $sddl
          if ($sddl -notmatch '\(A;;[^;]*;;;BU\)') { throw 'Пользователям не разрешён запуск проверки' }
          $ownUsers = (Get-Acl $root).Access | Where-Object { $_.IdentityReference -match 'Users' -and $_.FileSystemRights -match 'Write|Modify|FullControl' }
          if ($ownUsers) { throw 'Обычные пользователи могут менять файлы обновления' }

          # Настоящий запуск задачи от SYSTEM: ошибку в её команде потом не исправить удалённо.
          $launch = (Get-ScheduledTask -TaskName KerdiisLaunch).Actions[0].Execute
          if ($launch -ne $env:CAL_EXE) { throw "Задача запуска указывает на $launch" }
          Remove-Item (Join-Path $root 'status.json') -ErrorAction SilentlyContinue
          # Запуск от обычной учётной записи: так проверку начинает кнопка на панели.
          $password = 'Pw1!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name calcheck -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member calcheck
          $credential = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\calcheck", $secure)
          $check = Start-Process schtasks.exe -ArgumentList '/Run', '/TN', 'KerdiisUpdate' -Credential $credential -WorkingDirectory $env:SystemRoot -Wait -PassThru -WindowStyle Hidden
          Write-Host "schtasks от обычного пользователя: код $($check.ExitCode)"
          Remove-LocalUser -Name calcheck
          if ($check.ExitCode -ne 0) { throw 'Обычный пользователь не может запустить проверку обновлений' }
          foreach ($i in 1..24) {
            if (Test-Path (Join-Path $root 'status.json')) { break }
            Start-Sleep -Seconds 5
          }
          $own = Get-Content (Join-Path $root 'status.json') -Raw | ConvertFrom-Json
          Write-Host ($own | ConvertTo-Json)
          if (-not $own.current) { throw 'Задача не определила версию программы' }

          $setup = (Get-ChildItem dist/Kerdiis-Setup-*.exe).FullName
          $name = Split-Path $setup -Leaf
          New-Item -ItemType Directory -Force feed/v99.0.0, feed/latest/download | Out-Null
          Copy-Item $setup feed/v99.0.0/
          $yml = Get-Content dist/latest.yml -Raw
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8123', '--bind', '127.0.0.1', '--directory', 'feed' -PassThru
          $ready = $false
          foreach ($i in 1..30) {
            try {
              Invoke-WebRequest http://127.0.0.1:8123/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              $ready = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) { throw 'Локальный сервер обновлений не запустился' }

          function Run-Update($content, $expected) {
            [IO.File]::WriteAllText("$PWD/feed/latest/download/latest.yml", $content)
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'update.ps1') `
              -LatestUrl http://127.0.0.1:8123/latest/download/latest.yml -AssetBase http://127.0.0.1:8123
            $status = Get-Content (Join-Path $root 'status.json') -Raw | ConvertFrom-Json
            Write-Host ($status | ConvertTo-Json)
            if ($status.result -ne $expected) { throw "Ожидался результат $expected, получен $($status.result)" }
          }

          Run-Update ($yml -replace '(?m)^version:.*', 'version: 0.0.1') 'up-to-date'
          Run-Update (($yml -replace '(?m)^version:.*', 'version: 99.0.0') -replace '(?m)^sha512:.*', 'sha512: AAAA') 'failed'
          if (Get-ChildItem $root -Filter '*.exe') { throw 'Файл с неверной контрольной суммой не удалён' }
          Run-Update ($yml -replace '(?m)^version:.*', 'version: 99.0.0') 'installed'
          if (Get-ChildItem $root -Filter '*.exe') { throw 'Установщик не удалён после обновления' }
          if ((Get-Content (Join-Path (Split-Path $env:CAL_EXE) 'edition.txt') -Raw).Trim() -ne 'client') { throw 'Обновление изменило версию программы' }
          Get-ScheduledTask -TaskName KerdiisUpdate | Out-Null
          Stop-Process -Name Kerdiis -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $server.Id -Force
          $global:LASTEXITCODE = 0

      - name: Проверить удаление
        shell: pwsh
        run: |
          $dir = Split-Path $env:CAL_EXE
          $un = (Get-ChildItem $dir -Filter 'Uninstall*.exe').FullName
          Start-Process $un -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 10
          $run = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run').Kerdiis
          if ($run) { throw 'Запись автозапуска осталась' }
          netsh advfirewall firewall show rule name=Kerdiis | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Правило брандмауэра осталось' }
          $global:LASTEXITCODE = 0
          if (Get-ScheduledTask -TaskName KerdiisUpdate -ErrorAction SilentlyContinue) { throw 'Задача обновления осталась' }
          if (Test-Path (Join-Path $env:ProgramFiles 'KerdiisUpdate')) { throw 'Каталог обновления остался' }
          if (-not (Test-Path "$env:ProgramData\Kerdiis\config.ini")) { throw 'Настройки удалены' }

      - name: Сохранить снимки экрана
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/Kerdiis-*Setup-*.exe
          if-no-files-found: error

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $file = (Get-ChildItem dist/Kerdiis-Setup-*.exe).FullName
          # Релиз могли создать вручную на GitHub: тогда только добавляем установщик.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --generate-notes }
          gh release upload $tag $file --clobber
          gh release upload $tag (Get-ChildItem dist/Kerdiis-Admin-Setup-*.exe).FullName --clobber
          # latest.yml последним: панели увидят версию, только когда установщик уже на месте.
          gh release upload $tag dist/latest.yml --clobber
